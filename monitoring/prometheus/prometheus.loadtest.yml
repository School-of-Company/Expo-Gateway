# Used by load-test/docker-compose.yml: Prometheus and the gateway share a
# compose network, so the metrics port is scraped by service name and never
# needs to be published.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: expo-gateway
    static_configs:
      - targets: ["gateway:9464"]
