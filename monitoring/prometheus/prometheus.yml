global:
  # Short on purpose: this is a local/demo stack where seeing a failure within
  # seconds matters more than storage. Raise it for anything long-lived.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: expo-gateway
    static_configs:
      - targets: ["host.docker.internal:9464"]
